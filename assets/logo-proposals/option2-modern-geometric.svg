<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="d2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="d2_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>

    <linearGradient id="d2_whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="d2_accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Clean Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#d2_bg)"/>

  <!-- Subtle Rim -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <g filter="url(#d2_shadow)">
    <!-- Main "C" Shape: Bold geometric vector arc -->
    <path d="M 216,148
             C 134,166 74,232 74,312
             C 74,394 140,442 226,442
             L 292,442
             L 292,374
             L 226,374
             C 174,374 144,342 144,312
             C 144,268 180,224 236,214
             L 282,204
             L 254,148
             Z"
          fill="url(#d2_whiteGrad)"/>

    <!-- "1" Number: Sharp, bold numeral centered in opening -->
    <path d="M 262,246
             L 262,294
             L 316,252
             L 316,442
             L 384,442
             L 384,162
             L 326,162
             L 262,246
             Z"
          fill="url(#d2_whiteGrad)"/>

    <!-- Mortarboard Cap: Geometric diamond sitting on top -->
    <!-- Cap Rim -->
    <polygon points="180,126 356,192 356,204 180,138" fill="#cbd5e1"/>
    <polygon points="356,192 444,148 444,160 356,204" fill="#94a3b8"/>

    <!-- Cap Top -->
    <polygon points="180,126 268,82 444,148 356,192" fill="#ffffff"/>

    <!-- Cap Button -->
    <circle cx="312" cy="137" r="7" fill="#2563eb"/>

    <!-- Tassel: Geometric cord + pill tassel -->
    <path d="M 312,137 C 368,142 414,154 424,176 C 428,184 426,202 426,230"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- Tassel Brush: modern geometric capsule -->
    <rect x="419" y="228" width="14" height="42" rx="7" fill="#ffffff"/>
    <rect x="421" y="234" width="10" height="6" rx="2" fill="#60a5fa"/>
  </g>
</svg>