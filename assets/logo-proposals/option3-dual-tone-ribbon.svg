<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight-to-Electric Royal Gradient Background -->
    <linearGradient id="d3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Radial Cyan Accent Flare -->
    <radialGradient id="d3_flare" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Fluid C Ribbon Gradient -->
    <linearGradient id="d3_cRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- "1" Radiant Gradient -->
    <linearGradient id="d3_oneRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Mortarboard Cap Diamond Glow -->
    <linearGradient id="d3_capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Tassel Cyan Glow -->
    <linearGradient id="d3_tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="d3_glowShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#d3_bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#d3_flare)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

  <g filter="url(#d3_glowShadow)">
    <!-- Dynamic C Outer Loop -->
    <path d="M 218,146
             C 134,166 72,234 72,314
             C 72,396 138,442 226,442
             L 294,442
             L 294,374
             L 230,374
             C 176,374 144,342 144,312
             C 144,264 184,222 242,210
             L 286,200
             L 256,146
             Z"
          fill="url(#d3_cRibbon)"/>

    <!-- Subtle Depth Shadow Under C opening -->
    <path d="M 230,374 C 176,374 144,342 144,312 C 144,296 150,280 162,266 L 102,286 C 84,302 78,322 78,340 C 90,400 150,442 226,442 L 294,442 L 294,374 Z"
          fill="#0f172a" opacity="0.18"/>

    <!-- "1" Numeral: Electric vibrant gradient -->
    <path d="M 264,244
             L 264,288
             L 316,248
             L 316,442
             L 384,442
             L 384,160
             L 326,160
             L 264,244
             Z"
          fill="url(#d3_oneRibbon)"/>

    <!-- Mortarboard Cap Diamond -->
    <polygon points="182,128 356,192 356,204 182,140" fill="#7dd3fc" opacity="0.65"/>
    <polygon points="356,192 444,148 444,160 356,204" fill="#38bdf8" opacity="0.85"/>
    <polygon points="182,128 270,84 444,148 356,192" fill="url(#d3_capTop)"/>

    <!-- Cap Button with Cyan Glow -->
    <circle cx="313" cy="138" r="8" fill="#38bdf8"/>
    <circle cx="313" cy="138" r="4" fill="#ffffff"/>

    <!-- Tassel Fluid Draping Cord -->
    <path d="M 313,138 C 368,142 414,154 424,176 C 428,184 426,202 426,230"
          fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/>

    <!-- Tassel Ferrule & Brush -->
    <rect x="419" y="226" width="14" height="6" rx="3" fill="#38bdf8"/>
    <path d="M 420,232
             C 416,244 414,264 418,272
             C 421,277 431,277 434,272
             C 438,264 436,244 432,232
             Z"
          fill="url(#d3_tasselGrad)"/>
  </g>
</svg>